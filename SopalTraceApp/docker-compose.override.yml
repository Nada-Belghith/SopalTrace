services:
  # Développement : API appelable directement sur le port 9091, front servi par Vite (rechargement à chaud).
  sopaltrace.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "9091:8080"
      - "8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
  # Développement : conversion PDF joignable depuis le poste (API lancée hors Docker, suites E2E) sur
  # http://localhost:3000, uniquement en local (jamais publié en production).
  gotenberg:
    ports:
      - "127.0.0.1:3000:3000"
  sopaltrace.web:
    build:
      target: build-stage
    container_name: sopaltrace-web-dev
    # !override remplace le port 80 de production au lieu de s'y ajouter.
    ports: !override
      - "5173:5173"
    volumes:
      - ../SopalTraceWeb:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host
