services:
  sopaltrace.api:
    image: ${DOCKER_REGISTRY-}sopaltraceapi
    build:
      context: .
      dockerfile: SopalTrace.Api/Dockerfile
    # Pas de port publié : l'API n'est joignable que par nginx (service web), qui applique les en-têtes de sécurité.
    env_file:
      - .env
    environment:
      - TZ=Africa/Tunis
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__SopalTraceConnection=Server=sqlserver,1433;Database=SopalTraceDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      - EmailSettings__SmtpServer=${SMTP_SERVER}
      - EmailSettings__Port=${SMTP_PORT}
      - EmailSettings__SmtpUsername=${SMTP_USERNAME} 
      - EmailSettings__SenderEmail=${EMAIL_SENDER}
      - EmailSettings__AppPassword=${EMAIL_PASSWORD}
      - EmailSettings__SenderName=SopalTrace Production
      - Rapports__GotenbergUrl=http://gotenberg:3000
    depends_on:
      sqlserver:
        condition: service_healthy
      gotenberg:
        condition: service_started

  # Conversion des documents générés (Excel rempli -> PDF) : LibreOffice, joignable uniquement par l'API.
  gotenberg:
    image: gotenberg/gotenberg:8.20.1
    environment:
      - TZ=Africa/Tunis
    command: ["gotenberg", "--api-timeout=60s", "--chromium-auto-start=false", "--libreoffice-auto-start=true"]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    env_file:          
      - .env
    environment:
      - TZ=Africa/Tunis
      - ACCEPT_EULA=Y  
      - MSSQL_PID=Developer
      - SA_PASSWORD=${DB_PASSWORD}

    # Port SQL Server publié uniquement sur la machine hôte (jamais sur le réseau).
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sopal_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -Q \"SELECT 1\" -C"]
      interval: 10s
      timeout: 5s
      retries: 5

  sopaltrace.web:
    build:
      context: ../SopalTraceWeb
      dockerfile: Dockerfile
      target: production-stage
    environment:
      - TZ=Africa/Tunis
    ports:
      - "80:8080"
    depends_on:
      - sopaltrace.api

volumes:
  sopal_db_data: