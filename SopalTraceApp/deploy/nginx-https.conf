# Configuration HTTPS (montée par docker-compose.https.yml à la place de la configuration HTTP de l'image).
# Certificats attendus dans /etc/nginx/certs : sopaltrace.crt (chaîne complète) et sopaltrace.key.

# HTTP : redirection permanente vers HTTPS
server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/sopaltrace.crt;
    ssl_certificate_key /etc/nginx/certs/sopaltrace.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # Le navigateur n'utilise plus que HTTPS pour ce site pendant un an
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_name localhost;

    # Ne pas divulguer la version de nginx
    server_tokens off;
    client_max_body_size 10m;

    # En-têtes de sécurité appliqués à toutes les réponses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    # Aucune ressource externe : polices et icônes sont intégrées au build.
    # camera autorisée pour le scan des OF/BL (magasinier)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API : même origine que l'application (pas de CORS en production)
    location /api/ {
        proxy_pass http://sopaltrace.api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Routage SPA (Vue Router en mode history)
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
